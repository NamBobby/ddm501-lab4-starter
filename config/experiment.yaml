seed: 501
threshold: 0.30
primary_metric: val_pr_auc
dataset: data/credit_default.csv
experiment_name: assignment2-credit-risk

experiments:
  - {id: E01, model: logreg, engineered: true, params: {C: 0.1, max_iter: 2000}}
  - {id: E02, model: logreg, engineered: true, params: {C: 1.0, max_iter: 2000}}
  - {id: E03, model: logreg, engineered: true, params: {C: 10.0, max_iter: 2000}}
  - {id: E04, model: rf, engineered: true, params: {n_estimators: 200, max_depth: 8, min_samples_leaf: 20}}
  - {id: E05, model: rf, engineered: true, params: {n_estimators: 200, max_depth: 12, min_samples_leaf: 20}}
  - {id: E06, model: rf, engineered: true, params: {n_estimators: 300, max_depth: 12, min_samples_leaf: 20}}
  - {id: E07, model: hgb, engineered: true, params: {max_iter: 200, learning_rate: 0.06, max_depth: 6, l2_regularization: 1.0}}
  - {id: E08, model: hgb, engineered: true, params: {max_iter: 300, learning_rate: 0.06, max_depth: 6, l2_regularization: 1.0}}
  - {id: E09, model: hgb, engineered: true, params: {max_iter: 300, learning_rate: 0.10, max_depth: 6, l2_regularization: 1.0}}
  - {id: E10, model: hgb, engineered: false, params: {max_iter: 300, learning_rate: 0.06, max_depth: 6, l2_regularization: 1.0}}
